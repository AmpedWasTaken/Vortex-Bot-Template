<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vortex Bot Template</title>
  <desc id="desc">Banner for the Vortex Bot Template open source project</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0e14"/>
      <stop offset="45%" style="stop-color:#12182a"/>
      <stop offset="100%" style="stop-color:#1b1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5865F2"/>
      <stop offset="100%" style="stop-color:#9b84f8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#5865F2" stroke-width="1">
    <path d="M0 120 L1200 120 M0 240 L1200 240"/>
    <path d="M200 0 L200 360 M400 0 L400 360 M600 0 L600 360 M800 0 L800 360 M1000 0 L1000 360"/>
  </g>
  <circle cx="980" cy="80" r="140" fill="#5865F2" opacity="0.08" filter="url(#glow)"/>
  <circle cx="220" cy="300" r="100" fill="#9b84f8" opacity="0.06"/>
  <text x="80" y="165" fill="#ffffff" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-0.02em">Vortex</text>
  <text x="80" y="218" fill="url(#accent)" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-0.02em">Bot Template</text>
  <text x="80" y="275" fill="#a8b0d8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="400">Discord.js control plane — slash commands, entitlements, dashboard, Stripe</text>
  <rect x="80" y="300" width="280" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>
</svg>
